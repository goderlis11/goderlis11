<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 385" width="840" height="385" role="img" aria-label="Avatar animado de Derlis Caiza">
  <title>Derlis Caiza - avatar animado</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b2433"/>
    </linearGradient>
  </defs>

  <style>
    :root {
      --skin: #f1c27d;
      --skin-dark: #d9a566;
      --hair: #1a1a1a;
      --hoodie: #2f6fed;
      --shorts: #1f2937;
      --accent: #36bcf7;
    }
    text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }

    .float  { animation: float 3s ease-in-out infinite; }
    .blink  { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    .wave   { transform-origin: 242px 225px; animation: wave 1.2s ease-in-out infinite; }
    .shadow-av { transform-box: fill-box; transform-origin: center; animation: shadowav 3s ease-in-out infinite; }

    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes blink   { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes wave    { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(16deg); } }
    @keyframes shadowav{ 0%,100% { transform: scale(1); opacity:.35; } 50% { transform: scale(.88); opacity:.22; } }

    .msg { opacity: 0; animation: msg 20s infinite; }
    .m2 { animation-delay: 4s; }
    .m3 { animation-delay: 8s; }
    .m4 { animation-delay: 12s; }
    .m5 { animation-delay: 16s; }
    @keyframes msg {
      0%   { opacity: 0; transform: translateY(8px); }
      2.5% { opacity: 1; transform: translateY(0); }
      17.5%{ opacity: 1; transform: translateY(0); }
      20%  { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 0; }
    }

    .pill { animation: pill 3.5s ease-in-out infinite; }
    @keyframes pill { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

    .ball-move { animation: bounce 1s infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 1.4s linear infinite; }
    .ball-shadow { transform-box: fill-box; transform-origin: center; animation: ballshadow 1s infinite; }
    @keyframes bounce {
      0%   { transform: translateY(0);     animation-timing-function: cubic-bezier(.2,.6,.4,1); }
      50%  { transform: translateY(-50px); animation-timing-function: cubic-bezier(.6,0,.8,.4); }
      100% { transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ballshadow { 0%,100% { transform: scale(1); opacity:.4; } 50% { transform: scale(.55); opacity:.18; } }

    .lift { animation: lift 1.8s ease-in-out infinite; }
    @keyframes lift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-34px); } }

    .btn { animation: btn 2s infinite; }
    .b2 { animation-delay: .5s; } .b3 { animation-delay: 1s; } .b4 { animation-delay: 1.5s; }
    @keyframes btn { 0%,100% { opacity: .35; } 20% { opacity: 1; } 40% { opacity: .35; } }
  </style>

  <rect width="840" height="385" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="838" height="383" rx="21" fill="none" stroke="#30363d" stroke-width="2"/>

  <text x="200" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="var(--accent)">Derlis Caiza</text>
  <text x="200" y="74" text-anchor="middle" font-size="13" fill="#8b949e">Sistemas de la Información · UCE</text>

  <ellipse class="shadow-av" cx="200" cy="349" rx="62" ry="7" fill="#000"/>

  <g class="float">
    <rect x="168" y="318" width="24" height="22" fill="var(--skin)"/>
    <rect x="208" y="318" width="24" height="22" fill="var(--skin)"/>
    <ellipse cx="176" cy="341" rx="20" ry="8" fill="#e5e7eb"/>
    <ellipse cx="224" cy="341" rx="20" ry="8" fill="#e5e7eb"/>
    <rect x="156" y="342" width="40" height="3" rx="1.5" fill="#9ca3af"/>
    <rect x="204" y="342" width="40" height="3" rx="1.5" fill="#9ca3af"/>
    <rect x="156" y="288" width="88" height="34" rx="10" fill="var(--shorts)"/>
    <line x1="200" y1="298" x2="200" y2="322" stroke="#111827" stroke-width="2"/>

    <line x1="160" y1="228" x2="142" y2="280" stroke="var(--hoodie)" stroke-width="22" stroke-linecap="round"/>
    <circle cx="140" cy="287" r="10" fill="var(--skin)"/>

    <rect x="152" y="200" width="96" height="96" rx="26" fill="var(--hoodie)"/>
    <path d="M178 202 Q200 224 222 202" fill="none" stroke="#1e4fb8" stroke-width="5" stroke-linecap="round"/>
    <text x="200" y="262" text-anchor="middle" font-size="18" font-weight="800" fill="#fff" letter-spacing="1">UCE</text>

    <rect x="188" y="188" width="24" height="20" fill="var(--skin-dark)"/>

    <circle cx="154" cy="152" r="8" fill="var(--skin)"/>
    <circle cx="246" cy="152" r="8" fill="var(--skin)"/>
    <circle cx="200" cy="150" r="46" fill="var(--skin)"/>
    <path d="M153 146 Q148 98 200 96 Q252 98 247 146 Q236 122 200 120 Q164 122 153 146 Z" fill="var(--hair)"/>
    <line x1="176" y1="139" x2="192" y2="137" stroke="var(--hair)" stroke-width="3" stroke-linecap="round"/>
    <line x1="208" y1="137" x2="224" y2="139" stroke="var(--hair)" stroke-width="3" stroke-linecap="round"/>
    <ellipse class="blink" cx="184" cy="153" rx="5" ry="6.5" fill="#111"/>
    <ellipse class="blink" cx="216" cy="153" rx="5" ry="6.5" fill="#111"/>
    <circle cx="186" cy="150.5" r="1.8" fill="#fff"/>
    <circle cx="218" cy="150.5" r="1.8" fill="#fff"/>
    <circle cx="172" cy="168" r="6" fill="#ff8f8f" opacity=".3"/>
    <circle cx="228" cy="168" r="6" fill="#ff8f8f" opacity=".3"/>
    <path d="M186 170 Q200 184 214 170" fill="none" stroke="#7a3b2e" stroke-width="3" stroke-linecap="round"/>

    <g class="wave">
      <line x1="242" y1="226" x2="284" y2="186" stroke="var(--hoodie)" stroke-width="22" stroke-linecap="round"/>
      <circle cx="289" cy="180" r="11" fill="var(--skin)"/>
    </g>
  </g>

  <rect x="330" y="30" width="470" height="92" rx="18" fill="#161b22" stroke="var(--accent)" stroke-width="2"/>
  <polygon points="331,70 306,84 331,92" fill="#161b22" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
  <rect x="329" y="72" width="4" height="18" fill="#161b22"/>

  <g text-anchor="middle" fill="#e6edf3" font-size="21" font-weight="600">
    <text class="msg m1" x="565" y="83">¡Hola! Soy Derlis Caiza 👋</text>
    <text class="msg m2" x="565" y="83">Estudio Sistemas de la Información</text>
    <text class="msg m3" x="565" y="83">Cuarto semestre en la UCE · Quito</text>
    <text class="msg m4" x="565" y="83">Fútbol, gym y juegos retro de PS2</text>
    <text class="msg m5" x="565" y="83" fill="#36bcf7">Meta: especializarme en programación web</text>
  </g>

  <text x="330" y="160" font-size="13" fill="#8b949e">Herramientas que conozco (las bases):</text>
  <g font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">
    <g class="pill" style="animation-delay:0s"><rect x="330" y="172" width="86" height="28" rx="14" fill="#1f6feb" opacity=".85"/><text x="373" y="191">VS Code</text></g>
    <g class="pill" style="animation-delay:.3s"><rect x="426" y="172" width="100" height="28" rx="14" fill="#c2410c" opacity=".85"/><text x="476" y="191">NetBeans</text></g>
    <g class="pill" style="animation-delay:.6s"><rect x="536" y="172" width="92" height="28" rx="14" fill="#0f766e" opacity=".9"/><text x="582" y="191">DBeaver</text></g>
    <g class="pill" style="animation-delay:.9s"><rect x="638" y="172" width="62" height="28" rx="14" fill="#d97706" opacity=".9"/><text x="669" y="191">AWS</text></g>
    <g class="pill" style="animation-delay:1.2s"><rect x="330" y="210" width="120" height="28" rx="14" fill="#7c3aed" opacity=".85"/><text x="390" y="229">Antigravity</text></g>
    <g class="pill" style="animation-delay:1.5s"><rect x="460" y="210" width="64" height="28" rx="14" fill="#be185d" opacity=".85"/><text x="492" y="229">POO</text></g>
  </g>

  <line x1="320" y1="346" x2="810" y2="346" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>

  <ellipse class="ball-shadow" cx="390" cy="347" rx="18" ry="4" fill="#000"/>
  <g class="ball-move">
    <g class="spin">
      <circle cx="390" cy="326" r="19" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <polygon points="390,314 401,322 397,335 383,335 379,322" fill="#222"/>
      <line x1="390" y1="314" x2="390" y2="308" stroke="#222" stroke-width="2"/>
      <line x1="401" y1="322" x2="408" y2="319" stroke="#222" stroke-width="2"/>
      <line x1="379" y1="322" x2="372" y2="319" stroke="#222" stroke-width="2"/>
      <line x1="397" y1="335" x2="401" y2="341" stroke="#222" stroke-width="2"/>
      <line x1="383" y1="335" x2="379" y2="341" stroke="#222" stroke-width="2"/>
    </g>
  </g>
  <text x="390" y="371" text-anchor="middle" font-size="13" fill="#8b949e">Fútbol</text>

  <g class="lift">
    <rect x="520" y="327" width="80" height="7" rx="3" fill="#9ca3af"/>
    <rect x="512" y="314" width="12" height="33" rx="3" fill="#374151"/>
    <rect x="500" y="320" width="12" height="21" rx="3" fill="#4b5563"/>
    <rect x="596" y="314" width="12" height="33" rx="3" fill="#374151"/>
    <rect x="608" y="320" width="12" height="21" rx="3" fill="#4b5563"/>
  </g>
  <text x="560" y="371" text-anchor="middle" font-size="13" fill="#8b949e">Gym</text>

  <g transform="translate(700 322)">
    <path d="M-44 -4 Q-44 -22 -26 -22 L26 -22 Q44 -22 44 -4 L46 14 Q46 22 38 22 Q30 22 26 14 L22 8 L-22 8 L-26 14 Q-30 22 -38 22 Q-46 22 -46 14 Z" fill="#2b3340" stroke="#4b5563" stroke-width="2"/>
    <rect x="-33" y="-10" width="16" height="5" rx="1.5" fill="#9ca3af"/>
    <rect x="-27.5" y="-15.5" width="5" height="16" rx="1.5" fill="#9ca3af"/>
    <circle class="btn b1" cx="28" cy="-17" r="3.6" fill="#4ade80"/>
    <circle class="btn b2" cx="36" cy="-9"  r="3.6" fill="#f87171"/>
    <circle class="btn b3" cx="28" cy="-1"  r="3.6" fill="#60a5fa"/>
    <circle class="btn b4" cx="20" cy="-9"  r="3.6" fill="#f472b6"/>
    <circle cx="-10" cy="4" r="5" fill="#111827" stroke="#6b7280"/>
    <circle cx="10"  cy="4" r="5" fill="#111827" stroke="#6b7280"/>
  </g>
  <text x="700" y="371" text-anchor="middle" font-size="13" fill="#8b949e">Retro PS2</text>
</svg>
